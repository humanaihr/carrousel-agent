name: Agent Prospection Carrousel

on:
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      query:
        description: 'Requête (ex: DSI banque Paris)'
        required: false
        default: 'leads chauds du jour'
      min_score:
        description: 'Score minimum'
        required: false
        default: '70'

# Permission pour écrire dans le repo (push leads.json)
permissions:
  contents: write

jobs:
  prospect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package.json

      - name: Install dependencies
        run: cd src && npm install

      - name: Run agent + generate leads.json
        env:
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          QUERY:         ${{ github.event.inputs.query || 'leads chauds du jour' }}
          MIN_SCORE:     ${{ github.event.inputs.min_score || '70' }}
        run: cd src && node agent.js

      # Pousse leads.json dans le repo pour que le HTML puisse le lire
      - name: Push leads.json to repo
        run: |
          cp src/leads.json leads.json
          git config user.name "Agent Carrousel"
          git config user.email "agent@carrousel.fr"
          git add leads.json
          git diff --staged --quiet || git commit -m "🤖 Mise à jour leads — $(date '+%d/%m/%Y %H:%M')"
          git push
