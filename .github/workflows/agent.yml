name: Agent Prospection Carrousel

on:
  # Cron : lundi-vendredi à 8h et 14h UTC
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '0 14 * * 1-5'
  # Déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:
    inputs:
      query:
        description: 'Requête de prospection (ex: DSI banque Paris)'
        required: false
        default: 'leads chauds du jour'
      min_score:
        description: 'Score ICP minimum (défaut: 75)'
        required: false
        default: '75'

jobs:
  prospect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package.json

      - name: Install dependencies
        run: cd src && npm install

      - name: Run prospection cycle
        env:
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          QUERY:      ${{ github.event.inputs.query || 'leads chauds du jour' }}
          MIN_SCORE:  ${{ github.event.inputs.min_score || '75' }}
        run: cd src && node agent.js

      - name: Upload rapport leads
        uses: actions/upload-artifact@v4
        with:
          name: rapport-leads-${{ github.run_number }}
          path: src/rapport-*.json
          retention-days: 30
