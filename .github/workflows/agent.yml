name: Agent Prospection Carrousel

on:
  schedule:
    # Leads + signaux : lundi-vendredi 8h et 14h UTC
    - cron: '0 8 * * 1-5'
    - cron: '0 14 * * 1-5'
    # Signaux seuls : toutes les 4h en semaine
    - cron: '0 6,10,12,16,18 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode execution'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - leads-only
          - signals-only
      query:
        description: 'Requête leads (ex: DSI banque Paris)'
        required: false
        default: 'leads chauds du jour'
      min_score:
        description: 'Score minimum leads'
        required: false
        default: '70'

permissions:
  contents: write

jobs:
  prospect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package.json

      - name: Install dependencies
        run: cd src && npm install

      - name: Run leads agent
        if: ${{ github.event.inputs.mode != 'signals-only' }}
        env:
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          QUERY:         ${{ github.event.inputs.query || 'leads chauds du jour' }}
          MIN_SCORE:     ${{ github.event.inputs.min_score || '70' }}
        run: cd src && node agent.js

      - name: Run signals agent (BOAMP + RSS)
        if: ${{ github.event.inputs.mode != 'leads-only' }}
        env:
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: cd src && node agent-signals.js

      - name: Push leads.json + signals.json to repo
        run: |
          cp src/leads.json leads.json 2>/dev/null || echo "No leads.json"
          cp src/signals.json signals.json 2>/dev/null || echo "No signals.json"
          git config user.name "Agent Carrousel"
          git config user.email "agent@carrousel.fr"
          git add leads.json signals.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 Mise à jour leads + signaux — $(date '+%d/%m/%Y %H:%M')"
          git push
